<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>New Tab · Command Bar</title>
  <link rel="icon" href="icons/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main class="stage">
    <div class="clock" aria-label="Date and time"><div id="time"></div><div id="date"></div></div>
    <section class="palette" aria-label="Command bar">
      <button id="drag-handle" aria-label="Move command bar" title="Drag to move. Arrow keys move when focused; Home or double-click to center." hidden></button>
      <div class="search-row">
        <span class="search-icon" aria-hidden="true"></span>
        <input id="query" type="text" placeholder="Search or enter a website" autocomplete="off" autocapitalize="off" spellcheck="false" role="combobox" aria-label="Search tabs, bookmarks, history, or the web" aria-autocomplete="list" aria-controls="results" aria-expanded="true">
        <button id="clear" class="icon-button" aria-label="Clear search" hidden></button>
        <button id="dismiss" class="escape-key" aria-label="Dismiss command bar" hidden>esc</button>
      </div>
      <div class="filter-row" role="group" aria-label="Search scope">
        <button class="filter" data-filter="all" aria-pressed="true">Everything</button>
        <button class="filter" data-filter="tabs" aria-pressed="false">Tabs <span>@</span></button>
        <button class="filter" data-filter="bookmarks" aria-pressed="false">Bookmarks <span>*</span></button>
        <button class="filter" data-filter="history" aria-pressed="false">History <span>#</span></button>
        <button class="filter" data-filter="actions" aria-pressed="false">Actions <span>&gt;</span></button>
      </div>
      <div class="result-area">
        <div id="results" role="listbox" aria-label="Results"></div>
        <div id="empty" hidden></div>
        <div id="autocomplete-status" role="status" aria-live="polite" hidden></div>
      </div>
      <footer class="palette-footer">
        <div class="keyboard-hints">
          <span><span class="arrows"><kbd>↑</kbd><kbd>↓</kbd></span>Navigate</span>
          <span><kbd>↵</kbd><span id="enter-hint">Open</span></span>
          <span><kbd data-modifier=" ↵">⌘ ↵</kbd>New tab</span>
        </div>
        <button class="footer-settings" data-settings>Settings <kbd data-modifier=" ,">⌘ ,</kbd></button>
      </footer>
    </section>
    <div id="status" role="status" aria-live="polite"></div>
  </main>
  <dialog id="settings-dialog" aria-label="Settings">
    <div class="settings-layout">
      <nav class="settings-nav" aria-label="Settings sections">
        <div class="settings-nav-heading">Settings</div>
        <div class="settings-nav-items"></div>
        <button id="restore-defaults">Restore defaults</button>
      </nav>
      <div class="settings-content">
        <header class="settings-heading">
          <div><h2 id="settings-title">Appearance</h2><p id="settings-intro">How the bar looks.</p></div>
          <button id="close-settings" class="icon-button" aria-label="Close settings" autofocus></button>
        </header>
        <div id="settings-rows"></div>
        <div id="settings-status" role="status" aria-live="polite"></div>
      </div>
    </div>
  </dialog>
</body>
</html>
